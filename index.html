<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OurMood 💜</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="app">

        <header>
            <div class="logo">💜</div>
            <h1>OurMood</h1>
            <p class="subtitle">Ваш маленький мир на двоих</p>
        </header>

        <main>

            <section class="welcome">
                <h2>Привет! 👋</h2>
                <p>Как ты себя чувствуешь сегодня?</p>
            </section>

            <section class="partner-card">
                <div class="avatar">💑</div>

                <div class="partner-info">
                    <h3>Ваша пара</h3>
                    <p id="partner-status">
                        Пока вы не подключены
                    </p>
                </div>
            </section>

            <section class="mood-section">

                <h2>Моё настроение</h2>

                <div class="mood-grid">

                    <button class="mood" data-mood="Счастлив(а)">
                        <span>😊</span>
                        <small>Счастлив(а)</small>
                    </button>

                    <button class="mood" data-mood="Влюблён(а)">
                        <span>🥰</span>
                        <small>Влюблён(а)</small>
                    </button>

                    <button class="mood" data-mood="Скучаю">
                        <span>🥺</span>
                        <small>Скучаю</small>
                    </button>

                    <button class="mood" data-mood="Грустно">
                        <span>😔</span>
                        <small>Грустно</small>
                    </button>

                    <button class="mood" data-mood="Устал(а)">
                        <span>😴</span>
                        <small>Устал(а)</small>
                    </button>

                    <button class="mood" data-mood="Злюсь">
                        <span>😤</span>
                        <small>Злюсь</small>
                    </button>

                </div>

                <button id="save-mood" class="primary-button">
                    Сохранить настроение
                </button>

                <p id="message" class="message"></p>

            </section>

            <section class="invite-section">
                <h2>💌 Вы вместе?</h2>

                <p>
                    Создайте свою пару и делитесь настроением
                    друг с другом.
                </p>

                <button id="create-pair" class="secondary-button">
                    👫 Создать пару
                </button>
                
                <button id="share-pair" class="secondary-button">
                    💌 Пригласить партнёра
                </button>

                <button id="join-pair" class="secondary-button">
                    🔗 Подключиться к партнёру
                </button>

                <button id="leave-pair" class="secondary-button">
                    🚪 Покинуть пару
                </button>
            </section>

        </main>

        <footer>
            Сделано с 💜 для двоих
        </footer>

    </div>
<!-- ================================
    ОКНО ВВОДА ИМЕНИ
================================ -->

<div id="name-modal" class="name-modal">

    <div class="name-modal-content">

        <div class="name-modal-emoji">
            💜
        </div>

        <h2>
            Добро пожаловать в OurMood!
        </h2>

        <p>
            Как тебя зовут?
        </p>

        <input
            id="name-input"
            type="text"
            placeholder="Введите своё имя"
            maxlength="20"
            autocomplete="off"
        >

        <button
            id="name-submit"
            class="primary-button"
        >
            Продолжить →
        </button>

    </div>

</div>



    <script type="module" src="app.js"></script>

</body>
</html>

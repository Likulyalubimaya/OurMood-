<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OurMood 💜</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://telegram.org/js/telegram-web-app.js"
    ></script>

</head>


<body>

    <div class="app">

        <!-- ========================================= -->
        <!-- ШАПКА -->
        <!-- ========================================= -->

        <header>

            <div class="logo">
                💜
            </div>

            <h1>
                OurMood
            </h1>

            <p class="subtitle">
                Ваш маленький мир на двоих
            </p>

        </header>


        <main>

            <!-- ========================================= -->
            <!-- ПРИВЕТСТВИЕ -->
            <!-- ========================================= -->

            <section class="welcome">

                <h2>
                    Привет! 👋
                </h2>

                <p>
                    Как ты себя чувствуешь сегодня?
                </p>

            </section>


            <!-- ========================================= -->
            <!-- ПАРТНЁР -->
            <!-- ========================================= -->

            <section class="partner-card">

                <div class="avatar">
                    💑
                </div>

                <div class="partner-info">

                    <h3>
                        Ваша пара
                    </h3>

                    <p id="partner-status">
                        Пока вы не подключены
                    </p>

                </div>

            </section>


            <!-- ========================================= -->
            <!-- НАСТРОЕНИЕ -->
            <!-- ========================================= -->

            <section class="mood-section">

                <h2>
                    Моё настроение
                </h2>


                <div class="mood-grid">


                    <!-- СЧАСТЛИВ -->

                    <button
                        class="mood"
                        data-mood="Счастлив"
                    >

                        <span>
                            😊
                        </span>

                        <small>
                            Счастлив
                        </small>

                    </button>


                    <!-- ВЛЮБЛЁН -->

                    <button
                        class="mood"
                        data-mood="Влюблён"
                    >

                        <span>
                            🥰
                        </span>

                        <small>
                            Влюблён
                        </small>

                    </button>


                    <!-- СКУЧАЮ -->

                    <button
                        class="mood"
                        data-mood="Скучаю"
                    >

                        <span>
                            🥺
                        </span>

                        <small>
                            Скучаю
                        </small>

                    </button>


                    <!-- ГРУСТНО -->

                    <button
                        class="mood"
                        data-mood="Грустно"
                    >

                        <span>
                            😔
                        </span>

                        <small>
                            Грустно
                        </small>

                    </button>


                    <!-- УСТАЛ -->

                    <button
                        class="mood"
                        data-mood="Устал"
                    >

                        <span>
                            😴
                        </span>

                        <small>
                            Устал
                        </small>

                    </button>


                    <!-- ЗЛЮСЬ -->

                    <button
                        class="mood"
                        data-mood="Злюсь"
                    >

                        <span>
                            😤
                        </span>

                        <small>
                            Злюсь
                        </small>

                    </button>


                </div>


                <!-- СОХРАНИТЬ НАСТРОЕНИЕ -->

                <button
                    id="save-mood"
                    class="primary-button"
                >

                    Сохранить настроение

                </button>


                <p
                    id="message"
                    class="message"
                ></p>


            </section>


            <!-- ========================================= -->
            <!-- УПРАВЛЕНИЕ ПАРОЙ -->
            <!-- ========================================= -->

            <section class="invite-section">

                <h2>
                    💌 Вы вместе?
                </h2>


                <p>
                    Создайте свою пару и делитесь
                    настроением друг с другом.
                </p>


                <!-- ИЗМЕНИТЬ ПРОФИЛЬ -->

                <button
                    id="change-profile"
                    class="secondary-button"
                >

                    ✏️ Изменить профиль

                </button>


                <!-- СОЗДАТЬ ПАРУ -->

                <button
                    id="create-pair"
                    class="secondary-button"
                >

                    👫 Создать пару

                </button>


                <!-- ПРИГЛАСИТЬ -->

                <button
                    id="share-pair"
                    class="secondary-button"
                >

                    💌 Пригласить партнёра

                </button>


                <!-- ПОДКЛЮЧИТЬСЯ -->

                <button
                    id="join-pair"
                    class="secondary-button"
                >

                    🔗 Подключиться к партнёру

                </button>


                <!-- ПОКИНУТЬ ПАРУ -->

                <button
                    id="leave-pair"
                    class="secondary-button"
                >

                    🚪 Покинуть пару

                </button>


            </section>


        </main>


        <!-- ========================================= -->
        <!-- FOOTER -->
        <!-- ========================================= -->

        <footer>

            Сделано с 💜 для двоих

        </footer>


    </div>



    <!-- ================================================= -->
    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <!-- ================================================= -->

    <div
        id="name-modal"
        class="name-modal"
    >

        <div class="name-modal-content">


            <!-- ИКОНКА -->

            <div class="name-modal-emoji">

                💜

            </div>


            <!-- ЗАГОЛОВОК -->

            <h2 id="profile-modal-title">

                Добро пожаловать в OurMood!

            </h2>


            <!-- ПОДЗАГОЛОВОК -->

            <p id="profile-modal-subtitle">

                Расскажи немного о себе

            </p>


            <!-- ИМЯ -->

            <input
                id="name-input"
                type="text"
                placeholder="Введите своё имя"
                maxlength="20"
                autocomplete="off"
            >


            <!-- ПОЛ -->

            <div class="gender-title">

                Твой пол

            </div>


            <div class="gender-options">


                <!-- МУЖСКОЙ -->

                <label class="gender-option">

                    <input
                        type="radio"
                        name="gender"
                        value="male"
                    >

                    <span>

                        👨 Мужской

                    </span>

                </label>


                <!-- ЖЕНСКИЙ -->

                <label class="gender-option">

                    <input
                        type="radio"
                        name="gender"
                        value="female"
                    >

                    <span>

                        👩 Женский

                    </span>

                </label>


            </div>


            <!-- КНОПКА -->

            <button
                id="name-submit"
                class="primary-button"
            >

                Продолжить →

            </button>


        </div>

    </div>



    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script
        type="module"
        src="app.js"
    ></script>


</body>

</html>
